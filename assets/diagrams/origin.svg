<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="同源判断"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#34435a}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6a7990}.line{stroke:#8091ac;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8091ac"/></marker></defs><rect width="760" height="250" fill="#f8faff"/><text x="28" y="32" class="small">SAME ORIGIN · 三项全部一致</text><g fill="#e6edf8"><rect x="38" y="60" width="205" height="78" rx="6"/><rect x="278" y="60" width="205" height="78" rx="6"/><rect x="518" y="60" width="205" height="78" rx="6"/></g><text x="140" y="88" text-anchor="middle" class="small">scheme</text><text x="140" y="116" text-anchor="middle" class="label">https</text><text x="380" y="88" text-anchor="middle" class="small">host</text><text x="380" y="116" text-anchor="middle" class="label">example.com</text><text x="620" y="88" text-anchor="middle" class="small">port</text><text x="620" y="116" text-anchor="middle" class="label">443</text><text x="380" y="179" text-anchor="middle" class="label">https://example.com/a 与 https://example.com/b</text><text x="380" y="211" text-anchor="middle" class="small">同源：路径不同不影响。协议、主机或有效端口变化则不同源。</text></svg>