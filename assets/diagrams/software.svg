<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="三种软件表达方式"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#34435a}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6a7990}.line{stroke:#8091ac;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8091ac"/></marker></defs><rect width="760" height="250" fill="#f8faff"/><text x="28" y="32" class="small">同一个任务，可以用不同方式表达</text><g fill="#e8edf6"><rect x="30" y="57" width="220" height="143" rx="8"/><rect x="270" y="57" width="220" height="143" rx="8"/><rect x="510" y="57" width="220" height="143" rx="8"/></g><text x="140" y="93" text-anchor="middle" class="label">Software 1.0</text><text x="140" y="131" text-anchor="middle">显式代码</text><text x="140" y="168" text-anchor="middle" class="small">人写规则 → 程序执行</text><text x="380" y="93" text-anchor="middle" class="label">Software 2.0</text><text x="380" y="131" text-anchor="middle">模型权重</text><text x="380" y="168" text-anchor="middle" class="small">数据训练 → 参数推断</text><text x="620" y="93" text-anchor="middle" class="label">Software 3.0</text><text x="620" y="131" text-anchor="middle">自然语言提示</text><text x="620" y="168" text-anchor="middle" class="small">描述任务 → LLM生成</text><text x="380" y="230" text-anchor="middle" class="small">三种方式可以组合。共同需要清晰需求、测试与验证。</text></svg>