<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="CSS盒模型"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#34435a}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6a7990}.line{stroke:#8091ac;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8091ac"/></marker></defs><rect width="760" height="280" fill="#f8faff"/><rect x="55" y="25" width="420" height="230" fill="#f5e6bb"/><text x="75" y="48" class="small">margin · 外边距</text><rect x="88" y="65" width="352" height="160" fill="#6d829f"/><text x="102" y="87" style="font-size:13px;fill:white">border · 边框</text><rect x="113" y="99" width="302" height="103" fill="#d8e3f4"/><text x="126" y="119" class="small">padding · 内边距</text><rect x="161" y="137" width="207" height="43" fill="#fff"/><text x="265" y="165" text-anchor="middle" class="label">content 内容</text><text x="510" y="85" class="label">content-box</text><text x="510" y="113" class="small">width = 内容宽度</text><text x="510" y="159" class="label">border-box</text><text x="510" y="187" class="small">width = 内容 + padding</text><text x="510" y="211" class="small">　　　　 + border</text></svg>