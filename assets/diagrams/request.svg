<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="浏览器、HTTP与服务器的关系"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#34435a}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6a7990}.line{stroke:#8091ac;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8091ac"/></marker></defs><rect width="760" height="250" fill="#f8faff"/><text x="28" y="34" class="small">一次网页请求 · ONE REQUEST / ONE RESPONSE</text><rect x="40" y="70" width="165" height="110" rx="8" fill="#e9edf6"/><rect x="535" y="70" width="180" height="110" rx="8" fill="#f2e5e9"/><text x="122" y="115" text-anchor="middle" class="label">浏览器 / Client</text><text x="122" y="144" text-anchor="middle" class="small">解析与显示</text><text x="625" y="115" text-anchor="middle" class="label">服务器 / Server</text><text x="625" y="144" text-anchor="middle" class="small">读取文件 / 执行程序</text><path d="M220 100 H520" class="line"/><text x="370" y="84" text-anchor="middle" class="small">请求：方法 + URL + headers + body</text><path d="M520 155 H220" class="line"/><text x="370" y="180" text-anchor="middle" class="small">响应：状态 + headers + body</text><text x="380" y="223" text-anchor="middle" class="small">HTTP 约定消息语义；HTML / JSON 描述响应中的内容。</text></svg>